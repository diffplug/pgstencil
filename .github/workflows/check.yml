name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The exact pin in `devEngines.runtime`, which pnpm also enforces locally.
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm db:verify
      - run: pnpm typecheck
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm --filter @pgstencil/example-better-auth build
      - run: pnpm packages:verify
      - name: Remove this job's containers and volumes
        if: always()
        shell: bash
        run: |
          project=$(node --input-type=module -e "import {createHash} from 'node:crypto'; process.stdout.write('pgstencil-'+createHash('sha256').update(process.cwd()).digest('hex').slice(0,12))")
          docker compose -p "$project" down --volumes --remove-orphans
