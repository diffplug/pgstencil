name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm db:verify
      - run: pnpm typecheck
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm --filter @pgstencil/example-workers build
      - run: pnpm packages:verify
      - name: Remove this job's containers and volumes
        if: always()
        shell: bash
        run: |
          project=$(node --input-type=module -e "import {createHash} from 'node:crypto'; process.stdout.write('pgstencil-'+createHash('sha256').update(process.cwd()).digest('hex').slice(0,12))")
          docker compose -p "$project" down --volumes --remove-orphans
